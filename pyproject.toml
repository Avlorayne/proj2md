[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "proj2md"
version = "2.2.0"
description = "项目源码一键拼接工具：把整个项目合并成单个 Markdown 文档，方便投喂网页端 AI"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "yourname" }]
keywords = ["markdown", "ai", "chatgpt", "claude", "gemini", "cli"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

# 纯标准库，无必装依赖；pyperclip 仅优化 --clip 体验
[project.optional-dependencies]
clip = ["pyperclip"]

# ★ 核心：注册 proj2md 命令，指向 proj2md.py 里的 cli()
[project.scripts]
proj2md = "proj2md:cli"

# ★ 单文件发行版的关键声明
[tool.setuptools]
py-modules = ["proj2md"]
